name: E-Majstore CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    name: Build .NET Backend
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Podesi .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Vrati pakete
        run: dotnet restore eMajstor.API.csproj

      - name: Build projekta
        run: dotnet build eMajstor.API.csproj --configuration Release --no-restore

      - name: Pokreni testove
        run: dotnet test eMajstor.API.csproj --configuration Release --no-build
