services:
  backend:
    build: .
    container_name: emajstor-backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/eMajstor.db"
    volumes:
      - emajstor-data:/app/data

volumes:
  emajstor-data:
